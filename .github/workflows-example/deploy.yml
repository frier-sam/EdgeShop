# Example CI/CD workflow — copy this file to .github/workflows/deploy.yml
# to enable auto-deploy on push to main. It lives here (not already under
# .github/workflows/) so a fork doesn't start deploying to YOUR Cloudflare
# account with someone else's secrets the moment it's pushed.
#
# EdgeShop POD deploys as a single Cloudflare Worker (root wrangler.toml)
# that serves both the API and the built React frontend via the [assets]
# binding — there is no separate Cloudflare Pages project to deploy to.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build + Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (root workspaces: worker + frontend)
        run: npm install

      - name: Build frontend and deploy the worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
