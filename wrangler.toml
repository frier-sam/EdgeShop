name = "edgeshop"
main = "worker/src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "frontend/dist"
binding = "ASSETS"

# No `database_id` on purpose — see DEPLOY.md's "Automatic resource
# provisioning" section. Cloudflare Workers Builds (open beta, wrangler
# >= 4.45.0) creates a D1 database named `edgeshop-db` and binds it here
# automatically when this id is absent. `wrangler dev` (local/offline)
# and `wrangler deploy` from an authenticated CLI both also provision
# automatically on the same trigger. If you need to pin an existing
# database instead (or provisioning doesn't fire for your account), run
# `wrangler d1 create edgeshop-db` and add `database_id = "..."` back —
# see DEPLOY.md's manual fallback.
[[d1_databases]]
binding = "DB"
database_name = "edgeshop-db"

# No bucket id to omit here — R2 buckets are addressed purely by
# `bucket_name`, so this binding is already in the shape automatic
# provisioning expects: a fresh account gets a bucket named
# `edgeshop-images` created and bound the same way.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "edgeshop-images"

# POD.md §9.1 / §11 — daily orphan-design garbage collection. Runs the
# worker's scheduled() handler (worker/src/index.ts), which deletes
# `designs` rows with order_id IS NULL older than the
# `design_retention_days` setting (default 30 days) plus their R2
# preview objects. 03:00 UTC — off-peak for an INR-priced storefront.
[triggers]
crons = ["0 3 * * *"]
