    <!--
      POD-UI4.md §2.6 — Material Symbols Outlined, SUBSETTED via `icon_names=`
      (~20KB instead of ~340KB for the full variable font).

      This list MUST stay byte-identical to `ICON_NAMES` in
      src/components/ui/iconNames.ts; a name present in one but not the other
      renders the glyph as its literal ligature text ("shopping_cart") with no
      error anywhere. src/components/ui/__tests__/iconNames.test.ts parses this
      attribute out of this file and asserts the two match.

      `display=block` (not `swap`) is deliberate for icons: a swap period would
      flash the ligature text — actual words in the middle of buttons — before
      the glyphs arrive. `block` shows nothing until the font is ready.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&icon_names=add,add_shopping_cart,arrow_back,arrow_forward,aspect_ratio,autorenew,bolt,campaign,check,check_circle,chevron_left,chevron_right,close,cloud_upload,content_copy,credit_card,dashboard,delete,design_services,discount,download,drag_indicator,edit,error,expand_less,expand_more,favorite,filter_list,format_size,grid_on,grid_view,group,help,home,image,info,inventory_2,keyboard_arrow_down,keyboard_arrow_up,layers,link,local_offer,local_shipping,location_on,lock,logout,mail,menu,more_vert,open_in_new,palette,payments,pending,person,phone_in_talk,photo_camera,print,public,receipt_long,redo,remove,savings,schedule,search,sell,settings,shield,shopping_basket,shopping_cart,star,star_half,storefront,straighten,text_fields,tune,undo,upload,upload_file,verified,view_carousel,visibility,visibility_off,warning,zoom_in&display=block" rel="stylesheet">
